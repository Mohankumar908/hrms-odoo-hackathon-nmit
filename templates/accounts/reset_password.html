{% extends 'base/base.html' %}
{% block auth_content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center" style="background:linear-gradient(135deg,#1e1b4b,#312e81)">
  <div class="card shadow-lg" style="width:420px;border-radius:16px">
    <div class="card-body p-5">
      <h4 class="fw-bold mb-4">Set New Password</h4>
      {% if messages %}{% for msg in messages %}<div class="alert alert-danger py-2 small">{{ msg }}</div>{% endfor %}{% endif %}
      <form method="post">{% csrf_token %}
        <div class="mb-3"><label class="form-label">New Password</label>
          <input type="password" name="new_password" class="form-control" required></div>
        <div class="mb-4"><label class="form-label">Confirm Password</label>
          <input type="password" name="confirm_password" class="form-control" required></div>
        <button type="submit" class="btn btn-primary w-100">Reset Password</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
